#
# docker compose -f docker-compose.yml up -d
# docker compose -f docker-compose.yml down
#
# docker compose -f docker-compose.yml up -d minio
# docker compose -f docker-compose.yml down minio
#
# docker compose -f docker-compose.yml up -d zookeeper kafka-broker schema-registry
# docker compose -f docker-compose.yml down zookeeper kafka-broker schema-registry
#
# docker compose -f bd-docker-sandbox/docker-compose.yml up -d flink-jobmanager flink-taskmanager
# docker compose -f bd-docker-sandbox/docker-compose.yml down flink-jobmanager flink-taskmanager
# 
# docker compose up --build
# docker compose watch
---

#
include:
  - path: ./docker-minio.yml
  - path: ./docker-kafka-cluster.yml
  - path: ./docker-flink-cluster.yml

services:
  #
  # Flink Dev Container
  #
  devcontainer:
    image: mcr.microsoft.com/devcontainers/java:1-17-bookworm
#    build:
#      context: .
#      dockerfile: Dockerfile.dev
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    volumes:
      - .:/workspace/bd-flink-module:cached
      - ${HOME}/.m2:/home/vscode/.m2
      - ${HOME}/.ssh:/home/vscode/.ssh
      - sandbox_apps_path:/apps
    depends_on:
      - flink-jobmanager
    extra_hosts:
      - docker.sandbox.net:172.18.0.1
    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    #network_mode: service:mysqlserver
    network_mode: "sandbox.net"
    # [Optional] Required for ptrace-based debuggers like C++, Go, and Rust
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

#
volumes:
  #
  sandbox_apps_path:
    external: true

#
secrets:
  mysql-root-password:
    file: ${HOME}/IdeaProjects/neetastudio.in/conf/mysql/password.txt

#
networks:
  default:
    external: true
    driver: bridge
    name: sandbox.net
